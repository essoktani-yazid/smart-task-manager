name: Build All Installers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------
  # JOB 1 : WINDOWS (.exe)
  # ---------------------------------------------------
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Compilation
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # Création de l'EXE
    - name: Create Windows Installer
      run: |
        cd stm-client
        $JAR_FILE = "stm-client-1.0.0.jar"
        
        jpackage `
          --type exe `
          --input target `
          --name "SmartTaskManager" `
          --main-jar $JAR_FILE `
          --main-class com.smarttask.client.Launcher `
          --icon src/main/resources/images/icon.ico `
          --win-dir-chooser `
          --win-menu `
          --win-shortcut `
          --app-version "1.0.0" `
          --dest installer

    # Upload de l'artefact EXE
    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: SmartTaskManager-Windows-Setup
        path: stm-client/installer/*.exe

  # ---------------------------------------------------
  # JOB 2 : LINUX (.deb)
  # ---------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Compilation (sur Linux aussi)
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # Création du DEB
    - name: Create Linux Installer
      run: |
        # Variables
        JAR_VERSION="1.0.0"
        MAIN_JAR="stm-client-${JAR_VERSION}.jar"
        INPUT_DIR="stm-client/target"
        OUTPUT_DIR="installer"
        
        mkdir -p $OUTPUT_DIR
        
        # Commande jpackage Linux
        jpackage \
          --type deb \
          --input $INPUT_DIR \
          --name "smart-task-manager" \
          --main-jar $MAIN_JAR \
          --main-class com.smarttask.client.Launcher \
          --icon stm-client/src/main/resources/images/icon.png \
          --app-version $JAR_VERSION \
          --description "Smart Task Manager Desktop App" \
          --linux-shortcut \
          --linux-menu-group "Office" \
          --dest $OUTPUT_DIR

    # Upload de l'artefact DEB
    - name: Upload Linux DEB
      uses: actions/upload-artifact@v4
      with:
        name: SmartTaskManager-Linux-DEB
        path: installer/*.deb